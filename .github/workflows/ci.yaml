name: ci

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - master

env:
  RELEASE_MAJOR: "1"
  RELEASE_MINOR: "0"
  RELEASE_PATCH: "0"

permissions:
  contents: read

jobs:
  test:
    name: build and e2e
    runs-on: windows-2025-vs2026
    timeout-minutes: 90

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: install dependencies
        shell: powershell
        run: npm.cmd ci

      - name: build bundle
        shell: powershell
        run: npm.cmd run build

      - name: verify checked-in bundle
        shell: powershell
        run: git diff --exit-code -- dist/index.js

      - name: setup wdk7
        uses: ./

      - name: run e2e
        shell: powershell
        run: .\scripts\test-e2e.ps1 -Mode default

      - name: setup wdk7 with debugger
        uses: ./
        with:
          debugger: true

      - name: run debugger e2e
        shell: powershell
        run: .\scripts\test-e2e.ps1 -Mode debugger

  release:
    name: release
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    concurrency:
      group: release-master
      cancel-in-progress: false
    permissions:
      contents: write

    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: calculate version
        id: version
        env:
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          git fetch --force --tags origin

          BASE_TAG="v${RELEASE_MAJOR}.${RELEASE_MINOR}.${RELEASE_PATCH}"
          TAG_NAME="${BASE_TAG}.${GITHUB_RUN_NUMBER}"

          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "base_tag=$BASE_TAG" >> "$GITHUB_OUTPUT"
          echo "major_tag=v${RELEASE_MAJOR}" >> "$GITHUB_OUTPUT"

      - name: create tag
        env:
          TAG_NAME: ${{ steps.version.outputs.tag_name }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git rev-parse -q --verify "refs/tags/$TAG_NAME" >/dev/null; then
            TAG_SHA="$(git rev-list -n 1 "$TAG_NAME")"

            if [[ "$TAG_SHA" != "$HEAD_SHA" ]]; then
              echo "Tag $TAG_NAME already points to $TAG_SHA, not $HEAD_SHA."
              exit 1
            fi

            echo "Tag $TAG_NAME already exists on this commit."
          else
            git tag "$TAG_NAME" "$HEAD_SHA"
            git push origin "refs/tags/$TAG_NAME"
          fi

      - name: create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.version.outputs.tag_name }}
        run: |
          set -euo pipefail

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "Release $TAG_NAME already exists."
          else
            gh release create "$TAG_NAME" --verify-tag --generate-notes --latest --title "$TAG_NAME"
          fi

      - name: update major tag
        env:
          MAJOR_TAG: ${{ steps.version.outputs.major_tag }}
          BASE_TAG: ${{ steps.version.outputs.base_tag }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "$MAJOR_TAG" "$HEAD_SHA"
          git tag -f "$BASE_TAG" "$HEAD_SHA"
          git push -f origin "refs/tags/$MAJOR_TAG"
          git push -f origin "refs/tags/$BASE_TAG"

      - name: create rolling releases
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.version.outputs.tag_name }}
          MAJOR_TAG: ${{ steps.version.outputs.major_tag }}
          BASE_TAG: ${{ steps.version.outputs.base_tag }}
        run: |
          set -euo pipefail

          for alias in "$MAJOR_TAG" "$BASE_TAG"; do
            gh release delete "$alias" --yes --cleanup-tag=false || true
            gh release create "$alias" \
              --target "${GITHUB_SHA}" \
              --title "$alias (latest: $TAG_NAME)" \
              --notes "Rolling alias for setup-wdk7. Currently points to $TAG_NAME." \
              --latest=false
          done
